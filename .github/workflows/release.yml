name: Release Drafter / Creator

on:
  push:
    tags:
      - 'v0.1.0' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to create a GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # GitHub will automatically generate a changelog from your commit history!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
